services:
  db:
    image: postgres:18-alpine
    container_name: vara5-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vara5
      POSTGRES_PASSWORD: vara5_local_dev
      POSTGRES_DB: vara5_crm
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images expect the mount one level up from data/
      - vara5_pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vara5 -d vara5_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vara5_pgdata:
